<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="MOCA">
  <!-- app/icon.svg — el favicon. Next lo toma por convención de nombre y lo sirve como <link
       rel="icon">, así que reemplaza al planeta gris del navegador sin tocar el layout.

       Es la MARCA sola (las tres barras con la cruz), sin el texto "MOCA": a 16 px la palabra se
       convierte en una mancha. El dibujo es el mismo de app/Logo.tsx, reescalado a un lienzo
       cuadrado con aire alrededor — una pestaña recorta, y un logo pegado al borde se come. -->
  <rect width="128" height="128" rx="26" fill="#fcfeff" />
  <g transform="translate(20 14) scale(0.88)">
    <rect x="0" y="52" width="30" height="48" rx="6" fill="#a9d9ef" />
    <rect x="38" y="30" width="30" height="70" rx="6" fill="#1a8fc1" />
    <rect x="76" y="4" width="34" height="96" rx="17" fill="#63788a" />
    <path d="M90.2 16h5.6v7.4h7.4v5.6h-7.4V36.4h-5.6V29h-7.4v-5.6h7.4z" fill="#fff" />
  </g>
</svg>
